<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ikat Trips — Book weekend trips</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<div id="mockBar" class="mockbar" hidden><span>Preview mode — open from Telegram for full features</span></div>
<header class="topbar">
  <button id="backBtn" class="iconbtn" hidden aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="brand"><span class="mark"><svg viewBox="0 0 24 24"><path d="M3 19 9.5 6l4 7 2.5-4L21 19H3Z" fill="currentColor"/></svg></span><span>Ikat Trips</span></div>
  <div class="topright">
    <button id="bellBtn" class="iconbtn" aria-label="Notices"><svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6ZM10 20a2.2 2.2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><i id="bellDot" class="dot" hidden></i></button>
    <div class="avatar" id="avatar" title="Profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5 20c1.6-3.4 4.3-5 7.5-5s5.9 1.6 7.5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
  </div>
</header>
<main id="view"></main>
<nav class="tabbar" id="tabbar">
  <button data-tab="trips" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15.5 8.5-2.3 4.7-4.7 2.3 2.3-4.7Z" fill="currentColor"/></svg><span>Trips</span></button>
  <button data-tab="tickets"><svg viewBox="0 0 24 24"><path d="M4 7h16v3.2a2 2 0 0 0 0 6.6V20H4v-3.2a2 2 0 0 0 0-6.6V7Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 7v13" stroke="currentColor" stroke-width="2" stroke-dasharray="2.5 2.5"/></svg><span>Tickets</span></button>
  <button data-tab="checkin"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m9 13 2.2 2.2L15.5 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Check-in</span></button>
  <button data-tab="admin"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Admin</span></button>
  <button data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4.5 20c1.6-3.4 4.3-5 7.5-5s5.9 1.6 7.5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Profile</span></button>
</nav>
<div id="sheetRoot"></div>
<div id="toastRoot" aria-live="polite"></div>
<script src="app.js?v=3"></script>
</body>
</html>
